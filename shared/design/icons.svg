<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <!--
      선 굵기는 기본적으로 여기서 지정하지 않는다. use href로 외부 참조되면 이 문서
      안의 CSS 변수는 해석되지 않으므로, 굵기는 참조하는 쪽 문서에서 stroke-width를
      상속시켜 정한다 (tokens.css의 icon-stroke=1.0 및 structure.css의 .tree-icon 참조).
      모든 아이콘이 동일한 굵기(1.0)를 상속하여 글꼴 획 두께와 일치시킨다.

      주의: XML 주석 안에는 하이픈 두 개(연속)를 쓸 수 없다. 과거 여기 var(하이픈하이픈icon-stroke)
      표기를 그대로 주석에 적었다가 파싱이 깨져 아이콘 전체가 안 보인 적이 있다 — 실제 원인은
      한글이 아니라 이 규칙 위반이었다. 주석 수정 시 이 점을 주의한다.
    -->
    <!--
      앱 마크: 유일하게 테마와 무관한 고정 컬러 아이콘이다. 나머지 아이콘이 전부
      currentColor 선형인 것과 달리, 좌상단 브랜드 자리에서 "기능 버튼"이 아니라
      "프로그램 정체성"으로 읽혀야 하므로 채움 + 그라디언트를 쓴다. exe 배포 시
      프로그램 아이콘으로도 사용한다.

      좌 파랑 / 우 앰버 2분할 창(split panes) 형태이며 네 모서리 모두 라운드다.
      오른쪽 판은 rect가 아니라 path로 그린다 — rect로 그리면 오른쪽 두 모서리가
      각져서 바깥 라운드와 어긋난다.

      그라디언트 정의를 이 symbol 안에 둔 이유: 외부 문서에서 use href로 참조하면
      symbol 하위 트리만 복제되므로, defs 바깥에 둔 그라디언트는 url(#id)로 해석되지
      않아 아이콘이 검게 렌더링된다. 반드시 symbol 내부에 유지할 것.

      선이 아니라 채움 도형이라 1px 반정수 정렬 규칙의 대상이 아니다.
    -->
    <symbol id="icon-app" viewBox="0 0 16 16">
      <linearGradient id="app-blu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa9f8"/><stop offset="1" stop-color="#2f7fd6"/></linearGradient>
      <linearGradient id="app-amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f0952b"/></linearGradient>
      <rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="url(#app-blu)"/>
      <path d="M7.6 1.5h4.9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7.6z" fill="url(#app-amb)"/>
      <path d="M7.6 1.5v13" stroke="#ffffff" stroke-opacity=".75" stroke-width=".9"/>
      <rect x="3" y="4.4" width="3.3" height=".9" rx=".45" fill="#ffffff" fill-opacity=".95"/>
      <rect x="3" y="7.2" width="3.3" height=".9" rx=".45" fill="#ffffff" fill-opacity=".72"/>
      <rect x="3" y="10" width="2.1" height=".9" rx=".45" fill="#ffffff" fill-opacity=".5"/>
      <rect x="9.2" y="4.4" width="3.6" height=".9" rx=".45" fill="#3b2500" fill-opacity=".95"/>
      <rect x="9.2" y="7.2" width="2.5" height=".9" rx=".45" fill="#3b2500" fill-opacity=".7"/>
    </symbol>
    <!-- 탐색기 사이드바 접기/펴기 (VSCode "Toggle Primary Side Bar"과 동일 형태):
         사각형 프레임 안에 좌측 열을 채워 "사이드바가 이 자리에 있다"는 것을 형태로
         보여준다. 아래 icon-split(균등 분할)과 혼동하지 않도록 별도 심볼로 둔다 —
         이쪽은 비대칭 채움이라 사이드바 특유의 의미를 갖는다.
         문서 두 장 겹침(파일 은유)으로 바꿔봤으나 사용자가 이 사각형+좌측 채움
         형태로 되돌려 달라고 해 복원했다 — 문서 은유로 재변경하지 말 것. -->
    <symbol id="icon-sidebar" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1" fill="none" stroke="currentColor" stroke-linejoin="round"/><rect x="2.5" y="2.5" width="4" height="11" fill="currentColor" fill-opacity=".5"/></symbol>
    <!-- 에디터 분할 (좌우 1:1 균등 분할). icon-sidebar와 달리 채움 없이 중앙 세로선만
         두어 "두 영역이 대등하다"는 뜻을 준다. -->
    <symbol id="icon-split" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="12" height="10" fill="none" stroke="currentColor" stroke-linejoin="miter"/><path d="M7.5 2.5v10" fill="none" stroke="currentColor" stroke-linecap="butt"/></symbol>
    <!-- Zen 모드 (메뉴바·탐색기·세로 띠·상태줄을 모두 감추고 편집 영역만 남김):
         네 모서리 꺾쇠. 안쪽으로 모이는 형태라 "화면을 비운다"는 뜻을 준다.
         모든 변이 수직·수평이고 좌표가 반정수라 1px 선이 픽셀에 정확히 얹힌다. -->
    <symbol id="icon-zen" viewBox="0 0 16 16"><path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <!-- 닫힘 (VSCode Built-in 형태, 각지고 단순): 옅은 채움 + 또렷한 테두리.
         탭을 사선이 아닌 계단(v2 h7)으로 만들어 모든 변이 수직·수평이다.
         열림 아이콘과 좌상단 시작점(1.5,3.5)·탭 폭·하단선(y=12.5)을 공유한다. -->
    <symbol id="icon-folder" viewBox="0 0 16 16"><path d="M1.5 12.5v-9h4v2h7v7z" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-linejoin="round"/></symbol>
    <!-- Open folder: the angular rear body remains a continuous closed outline.
         The front parallelogram is shifted right by one pixel, and its mask hides
         rear-body lines that would otherwise remain visible through the flap. -->
    <symbol id="icon-folder-open" viewBox="0 0 16 16"><mask id="folder-open-rear-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16"><rect width="16" height="16" fill="white"/><path d="M2.5 12.5 4.5 7.5h10l-2 5z" fill="black" stroke="black"/></mask><path d="M1.5 12.5v-9h4v2h7v7z" fill="none" stroke="currentColor" stroke-linejoin="miter" mask="url(#folder-open-rear-mask)"/><path d="M2.5 12.5 4.5 7.5h10l-2 5z" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-file" viewBox="0 0 16 16"><path d="M3.5 2.5h6l3 3v8h-9zM9.5 2.5v3h3" fill="none" stroke="currentColor" stroke-linejoin="round"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 16 16"><path d="M12.5 5.5A5 5 0 1 0 13.5 8.5" fill="none" stroke="currentColor" stroke-linecap="round"/><path d="M12.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-open" viewBox="0 0 16 16"><path d="M2.5 13.5v-11h4v2h7v9z" fill="none" stroke="currentColor" stroke-linejoin="round"/><path d="M8.5 6.5v6M5.5 9.5h6" fill="none" stroke="currentColor"/></symbol>
    <symbol id="icon-clear-list" viewBox="0 0 16 16"><path d="M2.5 4.5h5M2.5 8.5h4M2.5 12.5h5M9.5 6.5l4 4m0-4-4 4" fill="none" stroke="currentColor" stroke-linecap="round"/></symbol>
    <!-- 모두 접기 (VSCode식): 정사각형 안에 빼기 -->
    <symbol id="icon-collapse-all" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1" fill="none" stroke="currentColor" stroke-linejoin="round"/><path d="M5.5 8.5h5" stroke="currentColor" stroke-linecap="round"/></symbol>
    <symbol id="icon-minimize" viewBox="0 0 16 16"><path d="M2.5 8.5h11" stroke="currentColor"/></symbol>
    <symbol id="icon-maximize" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1" fill="none" stroke="currentColor" stroke-linejoin="round"/></symbol>
    <symbol id="icon-restore" viewBox="0 0 16 16"><path d="M4.5 5.5h9v8h-9zM2.5 3.5h9v8" fill="none" stroke="currentColor" stroke-linejoin="round"/></symbol>
    <symbol id="icon-close" viewBox="0 0 16 16"><path d="m3.5 3.5 9 9m0-9-9 9" stroke="currentColor"/></symbol>
  </defs>
</svg>
